name: Quant Agent Scheduled Notify
on:
  schedule:
    # Trigger checks every 15 minutes, excluding the fixed 09:00/11:30 slots.
    - cron: "15,30,45 1 * * 1-5"
    - cron: "0,15,30,45 2 * * 1-5"
    - cron: "0,15,45 3 * * 1-5"
    - cron: "0,15,30,45 4 * * 1-5"
    - cron: "0,15,30 5 * * 1-5"
    # Fixed reports: Taipei 09:00 open, 11:30 midday, 15:40 close.
    - cron: "0 1 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: quant-agent-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: data/notify_state.json
          key: quant-agent-notify-state-${{ github.run_id }}
          restore-keys: quant-agent-notify-state-
      - name: Run scheduled notification
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "0 1 * * 1-5") python scripts/daily_notify.py --fixed open ;;
            "30 3 * * 1-5") python scripts/daily_notify.py --fixed midday ;;
            "40 7 * * 1-5") python scripts/daily_notify.py --fixed close ;;
            *) python scripts/daily_notify.py ;;
          esac
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          WATCHLIST_BRANCH: persistent-data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          APP_URL: ${{ secrets.APP_URL }}
      - name: Run manual notification
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/daily_notify.py --force
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          WATCHLIST_BRANCH: persistent-data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          APP_URL: ${{ secrets.APP_URL }}
      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/notify_state.json
          key: quant-agent-notify-state-${{ github.run_id }}
